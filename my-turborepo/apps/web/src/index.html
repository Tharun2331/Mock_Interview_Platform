<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <title>PrepPilot — Practise the interview before it counts</title>
    <script type="module" src="./frontend.tsx" async></script>
    <!-- Painted before the bundle runs, so the first frame is already the right
         canvas. next-themes cannot help here: it resolves the stored preference
         on mount, which is several hundred milliseconds of white flash into a
         dark app without this. The media query covers the default (system); a
         stored override is applied a frame later and only differs for the
         minority who picked against their OS. -->
    <style>
      html {
        background: #fafaf9;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #08090b;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
