name: CI

# Both branches, both directions. `dev` is where feature work lands and
# `master` is the deploy branch, so a merge into either is worth gating.
on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev, master]

# A second push to the same branch makes the first run irrelevant. Cancelling
# it keeps queue time down without weakening the gate — the newer commit is
# still fully checked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Generous rather than tight: the whole suite runs in seconds today, so a
    # job approaching this limit means something is hanging, not slow.
    timeout-minutes: 10

    # The workspace root is not the repository root.
    defaults:
      run:
        working-directory: my-turborepo

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to match `devEngines.packageManager` in
          # my-turborepo/package.json. Left floating, a Bun release could change
          # test or resolution behaviour without a commit touching the repo.
          bun-version: 1.3.14

      # --frozen-lockfile so a bun.lock that has drifted from package.json fails
      # here rather than being silently resolved into something no developer has
      # actually run.
      - name: Install
        run: bun install --frozen-lockfile

      # Type-checking is a real gate, not a formality: it is what caught the
      # duplicate @smithy/types resolution that `bun test` passed straight over.
      - name: Check types
        run: bun run check-types

      - name: Test
        run: bun run test

# Deliberately absent:
#
# - No build. `apps/web/build.ts` fails loudly on missing BUN_PUBLIC_* values,
#   so building here would need repository secrets. The build belongs with the
#   deploy pipeline in Phase 7.
# - No lint. `turbo run lint` exists at the root but no workspace defines a
#   `lint` script, so calling it would report success while checking nothing.
# - No AWS credentials. Every test is hermetic: apps/servers/__tests__/setup.ts
#   pins its own config and fake credentials, and the SDK clients are
#   intercepted by aws-sdk-client-mock. A job that needed real credentials would
#   mean a test had escaped its mock.
